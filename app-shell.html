<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>وَصْلُ</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #07172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            text-align: center;
        }
        .ring {
            width: 42px;
            height: 42px;
            margin: 0 auto 14px;
            border: 3px solid rgba(224, 232, 240, 0.25);
            border-top-color: #e2e8f0;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div>
        <div class="ring"></div>
        <p>جاري تحميل وَصْلُ ...</p>
    </div>
    <script>
        // تحميل التطبيق المحلي مباشرة بدون روابط خارجية تسبب الشاشة البيضاء
        setTimeout(function () {
            window.location.href = "./index.html";
        }, 500);
    </script>
</body>
</html>
